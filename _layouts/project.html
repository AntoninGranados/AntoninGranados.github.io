<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} — Antonin Granados</title>
  <link rel="icon" href="../assets/img/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/code-highlight.css">
  <script>
    (function(){
      var t = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/dracula.min.css">

  <script>
    MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'none'
      },
      chtml: {
        displayAlign: 'center',
        displayIndent: '0em',
        scale: 1
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
        ignoreHtmlClass: 'tex2jax_ignore',
        processHtmlClass: 'tex2jax_process',
        renderActions: {
          addMenu: []
        }
      },
      startup: {
        pageReady: () => {
          return MathJax.startup.defaultPageReady();
        }
      }
    };
  </script>

  <script id="MathJax-script" async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-content">
          <div class="brand-text">
            <h1><a href="/" class="brand-name-link">Antonin Granados</a></h1>
            <p class="muted">Engineering student at Telecom Paris</p>
          </div>
        </div>
      </div>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/#contact">Contact</a>
        <a href="/#projects">Projects</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"></button>
      </nav>
    </div>
  </header>

  <main>
    <div class="markdown-content">
      {{ content }}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; {{ 'now' | date: "%Y" }} Antonin Granados — <a href="/">antoningranados.github.io</a> — Using the <a href="https://draculatheme.com" target="_blank" rel="noopener">Dracula Theme</a></p>
    </div>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    // Smooth scroll to same-page anchors without leaving hashes in the URL
    document.addEventListener('DOMContentLoaded', () => {
      const normalizePath = (path) => path.replace(/\/index\.html$/, '').replace(/\/$/, '') || '/';
      const currentPath = normalizePath(window.location.pathname);
      const header = document.querySelector('.site-header');

      const scrollToId = (id) => {
        const target = document.getElementById(id);
        if (!target) return false;
        const offset = header ? header.offsetHeight + 20 : 0;
        const top = target.getBoundingClientRect().top + window.scrollY - offset;
        window.scrollTo({ top, behavior: 'smooth' });
        return true;
      };

      // Handle clicks on same-page anchors (including /#contact style links when already on /)
      document.querySelectorAll('a[href*="#"]').forEach(link => {
        const href = link.getAttribute('href');
        if (!href) return;

        const url = new URL(href, window.location.origin);
        if (normalizePath(url.pathname) !== currentPath || !url.hash) return;

        link.addEventListener('click', (e) => {
          e.preventDefault();
          const id = decodeURIComponent(url.hash.slice(1));
          if (scrollToId(id)) {
            history.replaceState(null, '', window.location.pathname + window.location.search);
          }
        });
      });

      // If the page was loaded with a hash, scroll once and clear it
      if (window.location.hash) {
        const id = decodeURIComponent(window.location.hash.slice(1));
        if (scrollToId(id)) {
          history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      }
    });
  </script>
  <script>
    // Initialize syntax highlighting
    document.addEventListener('DOMContentLoaded', function() {
      // Highlight all code blocks
      document.querySelectorAll('pre code').forEach((el) => {
        hljs.highlightElement(el);
      });

      // Open links in a new tab if they are external
      const links = document.querySelectorAll('a[href]');
      
      links.forEach(function(link) {
        const href = link.getAttribute('href');
        
        if (href && (href.startsWith('http://') || href.startsWith('https://')) && 
            !href.includes(window.location.hostname)) {
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer');
        }
      });
    });
  </script>
  <script>
    (function () {
      /* ── Lightbox (images + videos) ── */
      var overlay = document.createElement('div');
      overlay.className = 'lightbox-overlay';
      overlay.innerHTML = '<button class="lightbox-close" aria-label="Close">✕</button>';
      document.body.appendChild(overlay);
      var lbMedia = null;

      function openLightbox(el) {
        if (lbMedia) lbMedia.remove();
        var isVideo = el.tagName === 'VIDEO';
        if (isVideo) {
          lbMedia = document.createElement('video');
          lbMedia.src = el.currentSrc || el.src || (el.querySelector('source') ? el.querySelector('source').src : '');
          lbMedia.autoplay = true;
          lbMedia.loop = true;
          lbMedia.muted = true;
          lbMedia.playsInline = true;
        } else {
          lbMedia = document.createElement('img');
          lbMedia.src = el.src;
          lbMedia.alt = el.alt || '';
        }
        overlay.appendChild(lbMedia);
        overlay.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        overlay.classList.remove('open');
        document.body.style.overflow = '';
        if (lbMedia) {
          if (lbMedia.tagName === 'VIDEO') { lbMedia.pause(); lbMedia.src = ''; }
          lbMedia.remove();
          lbMedia = null;
        }
      }

      document.querySelectorAll('.markdown-content img').forEach(function (img) {
        img.addEventListener('click', function () { openLightbox(img); });
      });
      document.querySelectorAll('.markdown-content .video-container video').forEach(function (vid) {
        vid.addEventListener('click', function (e) { e.stopPropagation(); openLightbox(vid); });
      });
      overlay.addEventListener('click', function (e) {
        if (e.target === overlay || e.target.classList.contains('lightbox-close')) closeLightbox();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeLightbox();
      });

      /* ── Collapsible week sections ── */
      var CHEVRON = '<svg class="week-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
      var weekHeadings = Array.from(document.querySelectorAll('.markdown-content h2'))
            .filter(function (h) { return /week/i.test(h.textContent); });
      var wrapperMap = new Map();

      weekHeadings.forEach(function (h2) {
        /* Collect sibling nodes until the next h2 */
        var nodes = [], next = h2.nextElementSibling;
        while (next && next.tagName !== 'H2') { nodes.push(next); next = next.nextElementSibling; }
        if (!nodes.length) return;

        /* Wrap them */
        var wrapper = document.createElement('div');
        wrapper.className = 'week-content';
        wrapper.style.maxHeight = '0';
        h2.parentNode.insertBefore(wrapper, nodes[0]);
        nodes.forEach(function (n) { wrapper.appendChild(n); });
        wrapperMap.set(h2, wrapper);

        /* Style heading */
        h2.classList.add('week-heading', 'collapsed');
        h2.insertAdjacentHTML('beforeend', CHEVRON);

        h2.addEventListener('click', function () { toggleWeek(h2); });
      });

      function expandWeek(h2, animate) {
        var w = wrapperMap.get(h2);
        if (!w) return;
        h2.classList.remove('collapsed');
        if (animate === false) { w.style.maxHeight = 'none'; return; }
        w.style.maxHeight = w.scrollHeight + 'px';
        w.addEventListener('transitionend', function done() {
          w.style.maxHeight = 'none';
          w.removeEventListener('transitionend', done);
        });
      }
      function collapseWeek(h2) {
        var w = wrapperMap.get(h2);
        if (!w) return;
        w.style.maxHeight = w.scrollHeight + 'px';
        requestAnimationFrame(function () { requestAnimationFrame(function () { w.style.maxHeight = '0'; }); });
        h2.classList.add('collapsed');
      }
      function toggleWeek(h2) {
        h2.classList.contains('collapsed') ? expandWeek(h2) : collapseWeek(h2);
      }

      /* Expand the section containing a given element (for hash navigation) */
      function expandForEl(el) {
        if (!el) return;
        var w = el.closest ? el.closest('.week-content') : null;
        if (w) {
          var h2 = w.previousElementSibling;
          if (h2 && h2.classList.contains('week-heading')) expandWeek(h2, false);
        }
      }

      if (window.location.hash) expandForEl(document.getElementById(window.location.hash.slice(1)));
      document.addEventListener('click', function (e) {
        var a = e.target.closest('a[href*="#"]');
        if (!a) return;
        var id = (a.getAttribute('href') || '').split('#')[1];
        if (id) expandForEl(document.getElementById(id));
      });
    })();
  </script>
  <script>
    (function() {
      var SUN = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
      var MOON = '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

      var btn = document.getElementById('theme-toggle');
      var html = document.documentElement;

      function updateBtn(theme) {
        btn.innerHTML = theme === 'dark' ? SUN : MOON;
        btn.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode');
      }

      updateBtn(html.getAttribute('data-theme') || 'dark');

      btn.addEventListener('click', function() {
        var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        updateBtn(next);
      });

      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', function(e) {
        if (!localStorage.getItem('theme')) {
          var t = e.matches ? 'light' : 'dark';
          html.setAttribute('data-theme', t);
          updateBtn(t);
        }
      });
    })();
  </script>
</body>
</html>
