<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <div class="brand-content">
        <div class="brand-text">
          <h1><a href="/" class="brand-name-link">Antonin Granados</a></h1>
          <p class="muted">Engineering student at Telecom Paris</p>
        </div>
      </div>
    </div>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/#contact">Contact</a>
      <a href="/#projects">Projects</a>
      <a href="/#publications">Publications</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme"></button>
    </nav>
    <button class="nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-expanded="false">
      <svg class="icon-hamburger" width="18" height="14" viewBox="0 0 18 14" fill="currentColor" aria-hidden="true">
        <rect width="18" height="2" rx="1"/><rect y="6" width="18" height="2" rx="1"/><rect y="12" width="18" height="2" rx="1"/>
      </svg>
      <svg class="icon-close" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <line x1="1" y1="1" x2="13" y2="13"/><line x1="13" y1="1" x2="1" y2="13"/>
      </svg>
    </button>
  </div>
  <div class="mobile-nav" id="mobile-nav" hidden>
    <div class="container">
      <a href="/">Home</a>
      <a href="/#contact">Contact</a>
      <a href="/#projects">Projects</a>
      <a href="/#publications">Publications</a>
      <div class="mobile-nav-footer">
        <button class="theme-toggle" id="theme-toggle-mobile" aria-label="Toggle theme"></button>
        <span>Toggle theme</span>
      </div>
    </div>
  </div>
</header>
<script>
  (function () {
    var toggle = document.getElementById('nav-toggle');
    var nav    = document.getElementById('mobile-nav');
    if (!toggle || !nav) return;
    function close() {
      nav.hidden = true;
      toggle.setAttribute('aria-expanded', 'false');
      toggle.classList.remove('is-open');
    }
    toggle.addEventListener('click', function (e) {
      e.stopPropagation();
      var open = toggle.getAttribute('aria-expanded') === 'true';
      if (open) { close(); } else {
        nav.hidden = false;
        toggle.setAttribute('aria-expanded', 'true');
        toggle.classList.add('is-open');
      }
    });
    nav.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', close); });
    document.addEventListener('click', function (e) {
      if (!nav.hidden && !nav.contains(e.target) && e.target !== toggle && !toggle.contains(e.target)) close();
    });
  })();
</script>
