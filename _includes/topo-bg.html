<canvas id="topo-bg" aria-hidden="true"></canvas>
<canvas id="topo-shine" aria-hidden="true"></canvas>
<script>
(function () {
  /* -- Perlin noise -- */
  var P = new Uint8Array(512);
  var src = [151,160,137,91,90,15,131,13,201,95,96,53,194,233,7,225,140,36,103,30,69,142,8,99,37,240,21,10,23,190,6,148,247,120,234,75,0,26,197,62,94,252,219,203,117,35,11,32,57,177,33,88,237,149,56,87,174,20,125,136,171,168,68,175,74,165,71,134,139,48,27,166,77,146,158,231,83,111,229,122,60,211,133,230,220,105,92,41,55,46,245,40,244,102,143,54,65,25,63,161,1,216,80,73,209,76,132,187,208,89,18,169,200,196,135,130,116,188,159,86,164,100,109,198,173,186,3,64,52,217,226,250,124,123,5,202,38,147,118,126,255,82,85,212,207,206,59,227,47,16,58,17,182,189,28,42,223,183,170,213,119,248,152,2,44,154,163,70,221,153,101,155,167,43,172,9,129,22,39,253,19,98,108,110,79,113,224,232,178,185,112,104,218,246,97,228,251,34,242,193,238,210,144,12,191,179,162,241,81,51,145,235,249,14,239,107,49,192,214,31,181,199,106,157,184,84,204,176,115,121,50,45,127,4,150,254,138,236,205,93,222,114,67,29,24,72,243,141,128,195,78,66,215,61,156,180];
  for (var i = 0; i < 256; i++) P[i] = P[i + 256] = src[i];
  function fade(t) { return t*t*t*(t*(t*6-15)+10); }
  function lerp(a,b,t) { return a+t*(b-a); }
  function grad(h,x,y) { var g=h&3; return g===0?x+y:g===1?-x+y:g===2?x-y:-x-y; }
  function noise(x,y) {
    var xi=Math.floor(x)&255, yi=Math.floor(y)&255;
    x-=Math.floor(x); y-=Math.floor(y);
    var u=fade(x),v=fade(y),A=P[xi]+yi,B=P[xi+1]+yi;
    return lerp(lerp(grad(P[A],x,y),grad(P[B],x-1,y),u),
                lerp(grad(P[A+1],x,y-1),grad(P[B+1],x-1,y-1),u),v);
  }
  function fbm(x,y) {
    return (noise(x,y)*0.500+noise(x*2,y*2)*0.250+
            noise(x*4,y*4)*0.125+noise(x*8,y*8)*0.0625)*1.0667*0.5+0.5;
  }

  /* -- Page-specific noise offset derived from URL -- */
  var h = 0, path = window.location.pathname;
  for (var i = 0; i < path.length; i++) h = ((h << 5) - h + path.charCodeAt(i)) & 0x7fffffff;
  var OX = (h % 600) * 1.2;
  var OY = ((h >> 10) % 600) * 1.2;

  /* -- Canvases -- */
  var canvas = document.getElementById('topo-bg');
  var ctx = canvas.getContext('2d');
  var shine = document.getElementById('topo-shine');
  var sCtx = shine.getContext('2d');
  if (!ctx || !sCtx) return;

  /* -- Marching squares lookup -- */
  var MS = [
    [],[[2,3]],[[1,2]],[[1,3]],[[0,1]],[[0,3],[1,2]],
    [[0,2]],[[0,3]],[[0,3]],[[0,2]],[[0,1],[2,3]],
    [[0,1]],[[1,3]],[[1,2]],[[2,3]],[]
  ];
  function ep(e,x,y,v0,v1,v2,v3,th,S) {
    var t;
    if(e===0){t=v1!==v0?(th-v0)/(v1-v0):0.5;return[x+S*t,y];}
    if(e===1){t=v2!==v1?(th-v1)/(v2-v1):0.5;return[x+S,y+S*t];}
    if(e===2){t=v2!==v3?(th-v3)/(v2-v3):0.5;return[x+S*t,y+S];}
    t=v3!==v0?(th-v0)/(v3-v0):0.5;return[x,y+S*t];
  }

  var STEP = 8, SCALE = 0.00110, PAD = 48, PARALLAX = 0.18;
  var TH = (function(){ var a=[]; for(var i=1;i<=30;i++) a.push(i/31); return a; })();

  /* Cursor position in viewport coords */
  var cursorCX = -9999, cursorCY = -9999;

  function updateShinePos() {
    /* Convert viewport cursor to canvas-local coords (pre-transform).
       Canvas is offset by -PAD and shifted by parallax translateY. */
    var x = cursorCX + PAD;
    var y = cursorCY + PAD + Math.round(window.scrollY * PARALLAX);
    shine.style.setProperty('--shine-x', x + 'px');
    shine.style.setProperty('--shine-y', y + 'px');
  }

  function drawContours(targetCtx, color, TW, TH_px, rows, cols, field) {
    targetCtx.strokeStyle = color;
    targetCtx.lineWidth = 1;
    targetCtx.clearRect(0, 0, TW, TH_px);
    targetCtx.beginPath();
    for (var ti = 0; ti < TH.length; ti++) {
      var th = TH[ti];
      for (var r = 0; r < rows - 1; r++) {
        for (var c = 0; c < cols - 1; c++) {
          var v0=field[r*cols+c], v1=field[r*cols+c+1],
              v2=field[(r+1)*cols+c+1], v3=field[(r+1)*cols+c];
          var idx=(v0>=th?8:0)|(v1>=th?4:0)|(v2>=th?2:0)|(v3>=th?1:0);
          var segs=MS[idx]; if(!segs.length) continue;
          var x=c*STEP, y=r*STEP;
          for (var si = 0; si < segs.length; si++) {
            var p1=ep(segs[si][0],x,y,v0,v1,v2,v3,th,STEP);
            var p2=ep(segs[si][1],x,y,v0,v1,v2,v3,th,STEP);
            targetCtx.moveTo(p1[0],p1[1]); targetCtx.lineTo(p2[0],p2[1]);
          }
        }
      }
    }
    targetCtx.stroke();
  }

  function draw() {
    var W = window.innerWidth, H = window.innerHeight;
    var pageH = Math.max(document.body.scrollHeight, H);
    var extraH = Math.ceil((pageH - H) * PARALLAX) + STEP * 4;
    var TW = W + PAD * 2, TH_px = H + PAD * 2 + extraH;

    canvas.width = TW; canvas.height = TH_px;
    canvas.style.top  = '-' + PAD + 'px';
    canvas.style.left = '-' + PAD + 'px';
    shine.width = TW; shine.height = TH_px;
    shine.style.top  = '-' + PAD + 'px';
    shine.style.left = '-' + PAD + 'px';

    var cols = Math.ceil(TW / STEP) + 2, rows = Math.ceil(TH_px / STEP) + 2;
    var field = new Float32Array(cols * rows);
    for (var r = 0; r < rows; r++)
      for (var c = 0; c < cols; c++)
        field[r * cols + c] = fbm(c * STEP * SCALE + OX, r * STEP * SCALE + OY);

    var light = document.documentElement.getAttribute('data-theme') === 'light' ||
      (!document.documentElement.getAttribute('data-theme') &&
       window.matchMedia('(prefers-color-scheme:light)').matches);

    drawContours(ctx,   light ? 'rgba(98,114,164,0.32)'  : 'rgba(189,147,249,0.12)',  TW, TH_px, rows, cols, field);
    drawContours(sCtx,  light ? 'rgba(98,114,164,0.55)'  : 'rgba(189,147,249,0.38)',  TW, TH_px, rows, cols, field);

    updateShinePos();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', draw);
  } else {
    draw();
  }

  /* Scroll parallax — GPU transform only, no redraw */
  var rafId = null;
  window.addEventListener('scroll', function () {
    if (rafId) return;
    rafId = requestAnimationFrame(function () {
      rafId = null;
      var t = 'translateY(-' + Math.round(window.scrollY * PARALLAX) + 'px)';
      canvas.style.transform = t;
      shine.style.transform = t;
      updateShinePos();
    });
  }, { passive: true });

  var rT;
  window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(draw, 250); }, { passive: true });

  /* Cursor shine */
  var shineRaf = null, pendingCX = -9999, pendingCY = -9999;
  window.addEventListener('mousemove', function (e) {
    pendingCX = e.clientX; pendingCY = e.clientY;
    if (shineRaf) return;
    shineRaf = requestAnimationFrame(function () {
      shineRaf = null;
      cursorCX = pendingCX; cursorCY = pendingCY;
      updateShinePos();
    });
  }, { passive: true });

  var mo = new MutationObserver(function (mutations) {
    for (var i = 0; i < mutations.length; i++) {
      if (mutations[i].attributeName === 'data-theme') { draw(); break; }
    }
  });
  mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
